name: Tests

on: push

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
              node-version: [26.x]
        steps:
            - uses: actions/checkout@v5
            - name: Build w/ Node ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                node-version: ${{ matrix.node-version }}
            - run: npm ci
            - run: npm test
