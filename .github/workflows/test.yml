name: Tests

on: push

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
              node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v2
            - name: Build w/ Node ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                node-version: ${{ matrix.node-version }}
            - run: npm ci
            - run: npm test
